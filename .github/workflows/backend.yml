name: Authentication checks
on:
  pull_request:
    paths: ['backend/**', 'mobile/**', '.github/workflows/backend.yml']
  push:
    branches: [main]
    paths: ['backend/**', 'mobile/**', '.github/workflows/backend.yml']
permissions:
  contents: read
jobs:
  auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - run: pip install -r backend/requirements.lock.txt
      - run: ruff check backend
      - run: ruff format --check backend
      - run: python -m pytest backend/tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        working-directory: mobile
      - run: npm test -- --runTestsByPath tests/auth-e2e.test.tsx
        working-directory: mobile
        env:
          RUN_AUTH_E2E: '1'
          PYTHON_EXECUTABLE: python
