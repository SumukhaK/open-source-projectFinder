name: Reviewed merge
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number reviewed by the dispatching user
        type: string
        required: true
      reviewed_sha:
        description: Full 40-character commit SHA recorded in the review
        type: string
        required: true
permissions: {}
concurrency:
  group: reviewed-merge-${{ inputs.pr_number }}
  cancel-in-progress: false
jobs:
  merge:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Validate exact-head review and latest passing CI, then merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
        run: python scripts/merge_reviewed.py "$PR_NUMBER" "$REVIEWED_SHA"
