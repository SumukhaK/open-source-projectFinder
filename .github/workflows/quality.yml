name: Quality pipeline
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - name: Provision checksum-verified CPython with patched SQLite
        shell: bash
        run: |
          # Keep setup-python's pip cache; all checks use this standalone runtime.
          curl --fail --silent --show-error --location --retry 3 --max-time 120 \
            'https://github.com/astral-sh/python-build-standalone/releases/download/20261021/cpython-3.11.17%2B20261021-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz' \
            --output "$RUNNER_TEMP/backend-python.tar.gz"
          printf '%s  %s\n' '224ca8be2d28841e7a382a27c51e74f4ed0aabe249a79294684e782363165948' "$RUNNER_TEMP/backend-python.tar.gz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/backend-python"
          tar -xzf "$RUNNER_TEMP/backend-python.tar.gz" -C "$RUNNER_TEMP/backend-python"
          "$RUNNER_TEMP/backend-python/python/bin/python3.11" -m venv "$RUNNER_TEMP/backend-venv"
          echo "$RUNNER_TEMP/backend-venv/bin" >> "$GITHUB_PATH"
      - name: Require a WAL-fixed linked SQLite
        shell: bash
        run: |
          python - <<'PY'
          import sqlite3
          import sys
          sys.path.insert(0, "backend")
          from app.core.sqlite_runtime import wal_is_fixed
          print(f"Python {sys.version.split()[0]}; SQLite {sqlite3.sqlite_version}", flush=True)
          if sys.version_info[:3] != (3, 11, 17) or not wal_is_fixed(sqlite3.sqlite_version):
              raise SystemExit("Backend CI requires pinned CPython 3.11.17 with the SQLite WAL-reset fix")
          PY
      - run: python -m pip install -r backend/requirements.lock.txt
      - run: mkdir -p reports
      - run: ruff check backend scripts
      - run: ruff format --check backend scripts
      - run: python -m pytest backend/tests scripts/tests --cov=backend/app --cov-branch --cov-report=term-missing --cov-report=json:reports/backend-coverage.json --cov-report=xml:reports/backend-coverage.xml --junitxml=reports/backend-tests.xml
      - run: python scripts/quality.py coverage reports/backend-coverage.json
      - run: bandit -r backend/app -f json -o reports/bandit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backend-quality
          path: reports/
          retention-days: 7
  mobile:
    name: Mobile quality and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - run: python -m pip install -r backend/requirements.lock.txt
      - run: npm ci
        working-directory: mobile
      - run: npm run typecheck
        working-directory: mobile
      - run: npm run lint
        working-directory: mobile
      - run: npm run test:coverage
        working-directory: mobile
        env:
          RUN_AUTH_E2E: '1'
          PYTHON_EXECUTABLE: python
      - run: npm run assets:generate
        working-directory: mobile
      - run: git diff --exit-code -- mobile/assets/branding
      - run: npx expo export --platform all
        working-directory: mobile
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mobile-coverage
          path: mobile/coverage/
          retention-days: 7
  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: python -m pip install -r backend/requirements.lock.txt
      - run: mkdir -p reports
      - name: Audit pinned Python dependencies
        shell: bash
        run: |
          status=0
          pip-audit --strict --no-deps --disable-pip -r backend/requirements.lock.txt -f json -o reports/python-audit.json || status=$?
          if [ "$status" -gt 1 ]; then exit "$status"; fi
          python scripts/quality.py pip reports/python-audit.json
      - name: Audit pinned embedding dependencies
        shell: bash
        run: |
          # pip-audit cannot resolve PyTorch's +cpu local version from PyPI.
          # Audit the same 2.14.1 release; the install lock keeps the CPU wheel.
          sed 's/^torch==2\.14\.1+cpu$/torch==2.14.1/' backend/requirements.embeddings.lock.txt > reports/embeddings-audit-requirements.txt
          if grep -Eq '^[^#].*\+cpu' reports/embeddings-audit-requirements.txt; then
            echo "::error::torch +cpu pin was not rewritten for pip-audit; update the sed with the torch pin"
            exit 1
          fi
          if ! grep -Eq '^torch==[0-9]+\.[0-9]+\.[0-9]+$' reports/embeddings-audit-requirements.txt; then
            echo "::error::no plain torch==X.Y.Z pin found after the pip-audit rewrite"
            exit 1
          fi
          status=0
          pip-audit --strict --no-deps --disable-pip -r reports/embeddings-audit-requirements.txt -f json -o reports/embeddings-audit.json || status=$?
          if [ "$status" -gt 1 ]; then exit "$status"; fi
          python scripts/quality.py pip reports/embeddings-audit.json
      - name: Audit locked JavaScript dependencies
        shell: bash
        working-directory: mobile
        run: |
          status=0
          npm audit --package-lock-only --json > ../reports/npm-audit.json || status=$?
          if [ "$status" -gt 1 ]; then exit "$status"; fi
          python ../scripts/quality.py npm ../reports/npm-audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dependency-audits
          path: reports/
          retention-days: 7
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified open-source scanner
        run: python scripts/install_gitleaks.py
      - run: mkdir -p reports
      - name: Scan full Git history without exposing secrets
        run: .ci/bin/gitleaks git --redact --no-banner --report-format json --report-path reports/secrets.json .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: secret-scan
          path: reports/secrets.json
          retention-days: 7
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 1
    needs: [backend, mobile, dependencies, secrets]
    if: always()
    steps:
      - name: Require every check to succeed
        env:
          BACKEND: ${{ needs.backend.result }}
          MOBILE: ${{ needs.mobile.result }}
          DEPENDENCIES: ${{ needs.dependencies.result }}
          SECRETS: ${{ needs.secrets.result }}
        run: |
          if [[ "$BACKEND" != success || "$MOBILE" != success || "$DEPENDENCIES" != success || "$SECRETS" != success ]]; then
            echo "Quality gate failed: at least one required job failed, was cancelled or was skipped."
            exit 1
          fi
          echo "All quality checks passed. Code review is still required before merge."
