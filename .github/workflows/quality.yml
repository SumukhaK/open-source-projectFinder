name: Quality pipeline
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - run: python -m pip install -r backend/requirements.lock.txt
      - run: mkdir -p reports
      - run: ruff check backend scripts
      - run: ruff format --check backend scripts
      - run: python -m pytest backend/tests scripts/tests --cov=backend/app --cov-branch --cov-report=term-missing --cov-report=json:reports/backend-coverage.json --cov-report=xml:reports/backend-coverage.xml --junitxml=reports/backend-tests.xml
      - run: python scripts/quality.py coverage reports/backend-coverage.json
      - run: bandit -r backend/app -f json -o reports/bandit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backend-quality
          path: reports/
          retention-days: 7
  mobile:
    name: Mobile quality and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - run: python -m pip install -r backend/requirements.lock.txt
      - run: npm ci
        working-directory: mobile
      - run: npm run typecheck
        working-directory: mobile
      - run: npm run lint
        working-directory: mobile
      - run: npm run test:coverage
        working-directory: mobile
        env:
          RUN_AUTH_E2E: '1'
          PYTHON_EXECUTABLE: python
      - run: npm run assets:generate
        working-directory: mobile
      - run: git diff --exit-code -- mobile/assets/branding
      - run: npx expo export --platform all
        working-directory: mobile
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mobile-coverage
          path: mobile/coverage/
          retention-days: 7
  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: python -m pip install -r backend/requirements.lock.txt
      - run: mkdir -p reports
      - name: Audit pinned Python dependencies
        shell: bash
        run: |
          status=0
          pip-audit --strict --no-deps --disable-pip -r backend/requirements.lock.txt -f json -o reports/python-audit.json || status=$?
          if [ "$status" -gt 1 ]; then exit "$status"; fi
          python scripts/quality.py pip reports/python-audit.json
      - name: Audit locked JavaScript dependencies
        shell: bash
        working-directory: mobile
        run: |
          status=0
          npm audit --package-lock-only --json > ../reports/npm-audit.json || status=$?
          if [ "$status" -gt 1 ]; then exit "$status"; fi
          python ../scripts/quality.py npm ../reports/npm-audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dependency-audits
          path: reports/
          retention-days: 7
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified open-source scanner
        run: python scripts/install_gitleaks.py
      - run: mkdir -p reports
      - name: Scan full Git history without exposing secrets
        run: .ci/bin/gitleaks git --redact --no-banner --report-format json --report-path reports/secrets.json .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: secret-scan
          path: reports/secrets.json
          retention-days: 7
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 1
    needs: [backend, mobile, dependencies, secrets]
    if: always()
    steps:
      - name: Require every check to succeed
        env:
          BACKEND: ${{ needs.backend.result }}
          MOBILE: ${{ needs.mobile.result }}
          DEPENDENCIES: ${{ needs.dependencies.result }}
          SECRETS: ${{ needs.secrets.result }}
        run: |
          if [[ "$BACKEND" != success || "$MOBILE" != success || "$DEPENDENCIES" != success || "$SECRETS" != success ]]; then
            echo "Quality gate failed: at least one required job failed, was cancelled or was skipped."
            exit 1
          fi
          echo "All quality checks passed. Code review is still required before merge."
