<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 945 190" role="img" aria-labelledby="title desc"><title id="title">RepoRadar quality and delivery</title><desc id="desc">Feature pull requests pass quality checks and an exact-commit code review before validated merging to main.</desc><rect width="945" height="190" fill="#FFFFFF"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#57606A"/></marker></defs><g font-family="Arial, sans-serif" fill="#24292F"><text x="20" y="36" font-size="21">Quality before delivery</text><rect x="20" y="65" width="165" height="85" rx="10" fill="#F6F8FA" stroke="#D0D7DE"/><text x="102.5" y="100" text-anchor="middle" font-size="15">Feature PR</text><text x="102.5" y="125" text-anchor="middle" font-size="12" fill="#57606A">Branch changes</text><path d="M185 107 H200" stroke="#57606A" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="205" y="65" width="165" height="85" rx="10" fill="#F6F8FA" stroke="#D0D7DE"/><text x="287.5" y="100" text-anchor="middle" font-size="15">Quality checks</text><text x="287.5" y="125" text-anchor="middle" font-size="12" fill="#57606A">All gates pass</text><path d="M370 107 H385" stroke="#57606A" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="390" y="65" width="165" height="85" rx="10" fill="#F6F8FA" stroke="#D0D7DE"/><text x="472.5" y="100" text-anchor="middle" font-size="15">Code review</text><text x="472.5" y="125" text-anchor="middle" font-size="12" fill="#57606A">Exact commit</text><path d="M555 107 H570" stroke="#57606A" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="575" y="65" width="165" height="85" rx="10" fill="#F6F8FA" stroke="#D0D7DE"/><text x="657.5" y="100" text-anchor="middle" font-size="15">Verified merge</text><text x="657.5" y="125" text-anchor="middle" font-size="12" fill="#57606A">No stale review</text><path d="M740 107 H755" stroke="#57606A" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="760" y="65" width="165" height="85" rx="10" fill="#F6F8FA" stroke="#D0D7DE"/><text x="842.5" y="100" text-anchor="middle" font-size="15">main</text><text x="842.5" y="125" text-anchor="middle" font-size="12" fill="#57606A">Delivered change</text></g></svg>
