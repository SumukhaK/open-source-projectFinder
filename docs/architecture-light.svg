<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620" role="img" aria-labelledby="title desc">
<title id="title">RepoRadar architecture</title>
<desc id="desc">The mobile app sends a text or hold-to-talk voice idea to the FastAPI backend. The backend sends audio to Deepgram for speech to text and uses an LLM step, on Ollama and Cloudflare Workers AI profiles, to tidy the query and write a grounded summary that Deepgram can speak back. Hybrid search queries the live GitHub Search API and the 365-day Milvus archive in parallel and returns one merged list. A separate ingestion worker reads permissively licensed public repositories pushed in the last 365 days, prepares README and metadata chunks, embeds them with the E5 model and publishes them to Milvus. Device acceptance for voice and summary output is still pending.</desc>
