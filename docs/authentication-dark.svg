<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" role="img" aria-labelledby="title desc"><title id="title">RepoRadar authentication</title><desc id="desc">The mobile app uses FastAPI for GitHub OAuth, stores its own session securely, and the backend encrypts GitHub credentials.</desc><rect width="880" height="390" fill="#0D1117"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#8B949E"/></marker></defs><g font-family="Arial, sans-serif" fill="#E6EDF3"><text x="30" y="38" font-size="22">Implemented authentication</text><rect x="30" y="80" width="240" height="85" rx="10" fill="#161B22" stroke="#30363D"/><text x="150" y="112" text-anchor="middle" font-size="16">React Native app</text><text x="150" y="139" text-anchor="middle" fill="#8B949E" font-size="12">PKCE login and app session</text><rect x="320" y="80" width="240" height="85" rx="10" fill="#161B22" stroke="#30363D"/><text x="440" y="112" text-anchor="middle" font-size="16">FastAPI authentication</text><text x="440" y="139" text-anchor="middle" fill="#8B949E" font-size="12">State and single-use handoff</text><rect x="610" y="80" width="240" height="85" rx="10" fill="#161B22" stroke="#30363D"/><text x="730" y="112" text-anchor="middle" font-size="16">GitHub OAuth</text><text x="730" y="139" text-anchor="middle" fill="#8B949E" font-size="12">Verified GitHub identity</text><rect x="30" y="260" width="240" height="85" rx="10" fill="#161B22" stroke="#30363D"/><text x="150" y="292" text-anchor="middle" font-size="16">Device SecureStore</text><text x="150" y="319" text-anchor="middle" fill="#8B949E" font-size="12">App session only</text><rect x="320" y="260" width="240" height="85" rx="10" fill="#161B22" stroke="#30363D"/><text x="440" y="292" text-anchor="middle" font-size="16">SQLite on backend</text><text x="440" y="319" text-anchor="middle" fill="#8B949E" font-size="12">Encrypted GitHub credentials</text></g><g stroke="#8B949E" stroke-width="1.5" fill="none" marker-end="url(#arrow)"><path d="M270 122 H315"/><path d="M560 122 H605"/><path d="M150 165 V255"/><path d="M440 165 V255"/></g></svg>
