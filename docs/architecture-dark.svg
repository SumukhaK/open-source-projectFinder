<title id="title">RepoRadar planned architecture</title>
<desc id="desc">The mobile app sends text or voice ideas to FastAPI and idea processing. Hybrid search retrieves from Milvus and GitHub Search API, returning explained repository matches to the app. A periodic worker normalizes and embeds public GitHub repository content into Milvus.</desc>
