<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc"><title id="title">Planned hybrid search and weekly archive</title><desc id="desc">One mobile search calls FastAPI. GitHub keyword search and local Milvus vector search run in parallel. Their results are validated, deduplicated and fused into one list. A separate weekly worker maintains the rolling 365-day local archive. All changes are proposed.</desc><rect width="1000" height="680" fill="#0D1117"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8B949E"/></marker></defs>
